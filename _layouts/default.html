<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.theme | default: '' }}">

<main class="container">
  {{ content }}
</main>

<nav class="bottom-nav" aria-label="Primary">
  <div class="nav-slider" id="nav-slider"></div>
  <a href="{{ '/' | relative_url }}" class="nav-item {% if page.url == '/' %}active{% endif %}" data-index="0">
    <span class="nav-icon">&#8962;</span>
    <span class="nav-label">Home</span>
  </a>
  <a href="{{ '/about' | relative_url }}" class="nav-item {% if page.url contains '/about' %}active{% endif %}" data-index="1">
    <span class="nav-icon">&#128100;</span>
    <span class="nav-label">About</span>
  </a>
  <a href="{{ '/skills' | relative_url }}" class="nav-item {% if page.url contains '/skills' %}active{% endif %}" data-index="2">
    <span class="nav-icon">&#9889;</span>
    <span class="nav-label">Skills</span>
  </a>
  <a href="{{ '/micro-apps' | relative_url }}" class="nav-item {% if page.url contains '/micro-apps' %}active{% endif %}" data-index="3">
    <span class="nav-icon">&#128736;</span>
    <span class="nav-label">Work</span>
  </a>
  <a href="{{ '/blog' | relative_url }}" class="nav-item {% if page.url contains '/blog' %}active{% endif %}" data-index="4">
    <span class="nav-icon">&#9997;</span>
    <span class="nav-label">Blog</span>
  </a>
</nav>

<button id="theme-toggle" class="theme-float" aria-label="Toggle theme" title="Toggle theme">☾</button>

<footer class="site-footer">
  &copy; {{ site.time | date: "%Y" }} Satya Dileep Kumar Thotakura
</footer>

<script>
  (function () {
    const toggle = document.getElementById("theme-toggle");
    const saved = localStorage.getItem("theme");
    const isDark = saved === "dark";
    
    if (isDark) document.body.classList.add("dark");
    if (toggle) {
      toggle.textContent = isDark ? "☼" : "☾";
      toggle.addEventListener("click", () => {
        const d = document.body.classList.toggle("dark");
        localStorage.setItem("theme", d ? "dark" : "light");
        toggle.textContent = d ? "☼" : "☾";
      });
    }

    const start = new Date(2013, 1, 9);
    const now = new Date();
    let years = now.getFullYear() - start.getFullYear();
    const m = now.getMonth() - start.getMonth();
    if (m < 0 || (m === 0 && now.getDate() < start.getDate())) years--;
    const el = document.getElementById("exp-years");
    if (el) el.textContent = years;

    const slider = document.getElementById("nav-slider");
    const active = document.querySelector(".nav-item.active");
    if (slider && active) {
      const idx = parseInt(active.dataset.index);
      const items = document.querySelectorAll(".nav-item");
      const total = items.length;
      const pct = 100 / total;
      slider.style.left = (idx * pct) + "%";
      slider.style.width = pct + "%";
    }
  })();
</script>

</body>
</html>
