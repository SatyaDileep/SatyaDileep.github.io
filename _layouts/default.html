<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.theme | default: '' }}">

<header class="site-header glass">
  <a class="brand" href="{{ '/' | relative_url }}">AI PM</a>
  <nav class="site-nav" aria-label="Primary">
    <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
    <a href="{{ '/about' | relative_url }}" class="{% if page.url contains '/about' %}active{% endif %}">About</a>
    <a href="{{ '/skills' | relative_url }}" class="{% if page.url contains '/skills' %}active{% endif %}">Skills</a>
    <a href="{{ '/micro-apps' | relative_url }}" class="{% if page.url contains '/micro-apps' %}active{% endif %}">Work</a>
    <a href="{{ '/blog' | relative_url }}" class="{% if page.url contains '/blog' %}active{% endif %}">Blog</a>
  </nav>
  <div class="actions">
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">☾</button>
    <a class="cta" href="{{ '/contact' | relative_url }}">Contact</a>
  </div>
</header>

<main class="container">
  {{ content }}
</main>

<footer class="site-footer glass">
  © {{ site.time | date: "%Y" }} Satya Dileep Kumar Thotakura
  • <a href="{{ '/about' | relative_url }}">About</a>
  • <a href="{{ '/skills' | relative_url }}">Skills</a>
  • <a href="{{ '/contact' | relative_url }}">Contact</a>
  • <a href="https://github.com/SatyaDileep">GitHub</a>
  • <a href="https://www.linkedin.com/in/satya-dileepkumar-thotakura-9b25021b">LinkedIn</a>
</footer>

<script>
  (function () {
    const toggle = document.getElementById("theme-toggle");
    const saved = localStorage.getItem("theme");
    const isDark = saved === "dark";
    
    if (isDark) document.body.classList.add("dark");
    if (toggle) {
      toggle.textContent = isDark ? "☼" : "☾";
      toggle.addEventListener("click", () => {
        const d = document.body.classList.toggle("dark");
        localStorage.setItem("theme", d ? "dark" : "light");
        toggle.textContent = d ? "☼" : "☾";
      });
    }

    const start = new Date(2013, 1, 9);
    const now = new Date();
    let years = now.getFullYear() - start.getFullYear();
    const m = now.getMonth() - start.getMonth();
    if (m < 0 || (m === 0 && now.getDate() < start.getDate())) years--;
    const el = document.getElementById("exp-years");
    if (el) el.textContent = years;
  })();
</script>

</body>
</html>
