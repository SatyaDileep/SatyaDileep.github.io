<script>
  (function () {
    const toggle = document.getElementById("theme-toggle");
    const labels = { amber: "☼", purple: "♾" };
    const classMap = { amber: "dark-amber", purple: "dark-purple" };
    const valid = Object.keys(classMap);

    function applyTheme(theme) {
      const t = valid.includes(theme) ? theme : "amber";
      document.body.classList.remove("dark-amber", "dark-purple");
      document.body.classList.add(classMap[t]);
      if (toggle) toggle.textContent = labels[t];
      localStorage.setItem("theme", t);
    }

    const saved = localStorage.getItem("theme");
    applyTheme(saved || "amber");

    if (toggle) {
      toggle.addEventListener("click", () => {
        const current = localStorage.getItem("theme") || "amber";
        const next = current === "amber" ? "purple" : "amber";
        applyTheme(next);
      });
    }

    const start = new Date(2013, 1, 9);
    const now = new Date();
    let years = now.getFullYear() - start.getFullYear();
    const m = now.getMonth() - start.getMonth();
    if (m < 0 || (m === 0 && now.getDate() < start.getDate())) years--;
    const el = document.getElementById("exp-years");
    if (el) el.textContent = years;

    function setSlider() {
      const slider = document.getElementById("nav-slider");
      const items = document.querySelectorAll(".nav-item");
      const total = items.length;
      if (!slider || !total) return;
      let active = document.querySelector(".nav-item.active");
      if (!active) {
        const path = location.pathname;
        for (const item of items) {
          const href = item.getAttribute("href");
          if (href && path === href) { active = item; break; }
          if (href && href !== "/" && path.startsWith(href)) { active = item; break; }
        }
        if (!active) {
          const yearMatch = path.match(/^\/(20\d\d)/);
          if (yearMatch) active = items[4];
        }
      }
      if (active) {
        const idx = parseInt(active.dataset.index);
        const pct = 100 / total;
        slider.style.left = (idx * pct) + "%";
        slider.style.width = pct + "%";
      } else {
        slider.style.display = "none";
      }
    }
    setSlider();
  })();
</script>
