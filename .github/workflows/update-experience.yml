name: Update Experience Badge

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate experience from Feb 09, 2013
        shell: bash
        run: |
          START="2013-02-09"
          START_YEAR=$(date -d "$START" +%Y)
          START_MONTH=$(date -d "$START" +%m)
          NOW_YEAR=$(date +%Y)
          NOW_MONTH=$(date +%m)
          YEARS=$((NOW_YEAR - START_YEAR))
          MONTHS=$((10#$NOW_MONTH - 10#$START_MONTH))
          if [ $MONTHS -lt 0 ]; then
            YEARS=$((YEARS - 1))
          fi
          LABEL="${YEARS}+ years"
          echo "EXPERIENCE=$LABEL" >> $GITHUB_ENV

      - name: Update README
        shell: bash
        run: |
          sed -i "s|<!-- EXPERIENCE -->.*<!-- END_EXPERIENCE -->|<!-- EXPERIENCE -->${{ env.EXPERIENCE }}<!-- END_EXPERIENCE -->|" README.md

      - name: Commit & push
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update experience badge (${{ env.EXPERIENCE }})"
          git push
